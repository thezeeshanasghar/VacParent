<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Your children</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="child-content">
  <div class="child-wrap">

    <div *ngIf="!childs" class="loading-state">
      <ion-spinner name="crescent" color="primary"></ion-spinner>
    </div>

    <div *ngIf="childs && childs.length === 0" class="empty-state">
      <ion-icon name="happy-outline" aria-hidden="true"></ion-icon>
      <p>No children on your account yet</p>
    </div>

    <!-- Child cards -->
    <div *ngFor="let child of childs; trackBy: trackById" class="child-card">
      <div class="child-top">
        <div class="child-avatar" [class.girl]="child._girl" [class.boy]="!child._girl">
          {{ child._initials }}
        </div>
        <div class="child-id">
          <div class="child-name">{{ child.Name }}</div>
          <div class="child-sub">{{ child._ageLabel }} · {{ child.Gender }}</div>
        </div>
        <div class="child-frac" [ngClass]="child._status">
          <span class="frac-num">{{ child._given }}</span><span class="frac-den">/{{ child._total || '–' }}</span>
          <div class="frac-cap">doses</div>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill" [ngClass]="child._status" [style.width.%]="child._pct"></div>
      </div>

      <div class="child-status" [ngClass]="child._status" *ngIf="child._statusLine">
        <ion-icon [name]="child._status === 'completed' ? 'checkmark-circle' :
                          child._status === 'overdue' ? 'warning' :
                          child._status === 'due' ? 'time' : 'ellipse'"></ion-icon>
        {{ child._statusLine }}
      </div>

      <div class="child-actions">
        <button class="vp-btn-primary vp-btn-block" routerLink="vaccine/{{child.Id}}">
          <ion-icon name="list-outline"></ion-icon> Schedule
        </button>
        <button class="vp-btn-outline vp-btn-block" routerLink="followup/{{child.Id}}">
          <ion-icon name="pulse-outline"></ion-icon> Follow-up
        </button>
      </div>
    </div>

    <!-- Add child request -->
    <div class="add-card" *ngIf="childs" (click)="requestAddChild()">
      <div class="add-icon"><ion-icon name="add"></ion-icon></div>
      <div class="add-text">
        <div class="add-title">Add another child</div>
        <div class="add-sub">Send a request to your clinic</div>
      </div>
      <ion-icon name="chevron-forward" class="add-chev"></ion-icon>
    </div>

  </div>
</ion-content>
